services:
  web:
    build: .
    environment:
      - ORTHOFINDER_DB_PATH=/data/orthofinder_new.db
      - ORTHOFINDER_SPECIES_COLORS_PATH=/data/species_colors.json
      - GOOGLE_ANALYTICS_MEASUREMENT_ID=G-PNPRJG75KM
    volumes:
      - orthofinder-data:/data
    expose:
      - "8000"

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      - web
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro

  ingest:
    profiles:
      - ingest
    build: .
    entrypoint: ["python", "scripts/ingest_orthofinder.py"]
    command: ["--config", "/config/orthofinder_ingest.docker.json"]
    volumes:
      - orthofinder-data:/data
      - ./config:/config:ro

volumes:
  orthofinder-data:
