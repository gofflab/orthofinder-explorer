services:
  web:
    build: .
    environment:
      - ORTHOFINDER_DB_PATH=/data/orthofinder_new.db
    volumes:
      - orthofinder-data:/data
      - static-assets:/app/app/static
    expose:
      - "8000"

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      - web
    ports:
      - "8080:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro

  ingest:
    profiles:
      - ingest
    build: .
    entrypoint: ["python", "scripts/ingest_orthofinder.py"]
    command: ["--config", "/config/orthofinder_ingest.docker.json"]
    volumes:
      - orthofinder-data:/data
      - static-assets:/app/app/static
      - ./config:/config:ro

volumes:
  orthofinder-data:
  static-assets:
